services:
  
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: builder
    working_dir: /app/backend
    command: sh -c "./node_modules/.bin/prisma db push && ./node_modules/.bin/prisma generate && pnpm run start:dev"
    volumes:
      - ./shared:/app/shared
      - ./backend:/app/backend
      - /app/frontend/node_modules
      - /app/backend/node_modules
    environment:
      - NODE_ENV=development
      - FRONTEND_URL=${FRONTEND_URL} # Exported from Makefile when dev
      - CHOKIDAR_USEPOLLING=true
      - TSC_WATCHFILE=DynamicPriorityPolling
      - TSC_WATCHDIRECTORY=DynamicPriorityPolling
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: builder
    working_dir: /app/frontend
    command: pnpm run dev --host 0.0.0.0
    volumes:
      - ./shared:/app/shared
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
      - /app/frontend/node_modules
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s