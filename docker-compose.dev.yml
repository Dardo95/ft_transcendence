services:
  
  backend:
    image: backend:dev
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: builder
    working_dir: /app/backend
    command: sh -c "./node_modules/.bin/prisma db push && ./node_modules/.bin/prisma generate && pnpm exec tsc -p ../shared/tsconfig.json && (pnpm exec tsc -p ../shared/tsconfig.json --watch --preserveWatchOutput &) && ./node_modules/.bin/nest start --watch"
    volumes:
      - ./shared/src:/app/shared/src
      - ./backend/src:/app/backend/src
      - ./backend/prisma:/app/backend/prisma
      - ./backend/test:/app/backend/test
      - ./backend/uploads:/app/backend/uploads
    environment:
      - NODE_ENV=development
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173} # Exported from Makefile when dev
      - CHOKIDAR_USEPOLLING=true
      - TSC_WATCHFILE=DynamicPriorityPolling
      - TSC_WATCHDIRECTORY=DynamicPriorityPolling
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 40s

  frontend:
    image: frontend:dev
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: builder
    working_dir: /app/frontend
    command: pnpm run dev --host 0.0.0.0
    volumes:
      - ./shared/src:/app/shared/src
      - ./frontend/src:/app/frontend/src
      - ./frontend/public:/app/frontend/public
      - ./frontend/index.html:/app/frontend/index.html:ro
      - ./frontend/vite.config.ts:/app/frontend/vite.config.ts:ro
      - ./frontend/tsconfig.json:/app/frontend/tsconfig.json:ro
      - ./frontend/tsconfig.app.json:/app/frontend/tsconfig.app.json:ro
      - ./frontend/tsconfig.node.json:/app/frontend/tsconfig.node.json:ro
      - ./frontend/postcss.config.mjs:/app/frontend/postcss.config.mjs:ro
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s