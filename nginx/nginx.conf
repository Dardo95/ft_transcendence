events {
    worker_connections 1024;
}

http {
    client_max_body_size 3m;

    # Do not reveal the nginx version in headers and error pages.
    server_tokens off;

    # AUTH-B-11: brute-force protection for login and register.
    # 10 attempts per minute per client IP, with a burst of 5 (see below).
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_status 429;

    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # AUTH-B-11: security headers. Declared once at server level, so every
        # location below inherits them: none of them has its own add_header.
        # `always` also sends them on error responses (4xx/5xx).
        #
        # No Strict-Transport-Security on purpose: the certificate is
        # self-signed and HSTS on localhost would also force HTTPS on the
        # `make dev` frontend (http://localhost:5173).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # script-src 'unsafe-eval': Pixi.js v8 generates shader/uniform code at
        # runtime. style-src 'unsafe-inline': UI libraries (toasts) inject
        # <style> tags. Google Fonts are loaded from index.html.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' wss://$http_host; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Only login and register are rate limited. The rest of /api/auth/
        # (session check on every page load, logout, Google OAuth) is not.
        location ~ ^/api/auth/(login|register)$ {
            limit_req zone=auth burst=5 nodelay;
            error_page 429 = @auth_rate_limited;

            proxy_pass http://backend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # Same body shape as the backend errors (AUTH-B-14).
        location @auth_rate_limited {
            default_type application/json;
            return 429 '{"statusCode":429,"error":"Too Many Requests","message":"Too many attempts, please try again later"}';
        }

        location /api/ {
            proxy_pass http://backend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location /socket.io/ {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    server {
        listen 80;
        return 301 https://$host$request_uri;
    }
}
